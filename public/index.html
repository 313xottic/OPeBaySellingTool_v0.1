<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCG Marketplace — eBay Seller Tools</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#060610;--bg2:#0c0c1e;--bg3:#101028;--bd:#1c1c3a;--bd2:#2a2a50;--tx:#e4e4f0;--dim:#6a6a88;--ac:#e84118;--ac2:#ff6348;--acG:rgba(232,65,24,.15);--grn:#22c55e;--ylw:#f59e0b}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;font-size:14px}
button{font-family:inherit;cursor:pointer}input,select,textarea{font-family:inherit}a{color:var(--ac)}
code{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--bg3);padding:2px 6px;border-radius:4px}
:root{--hdr-h:71px}
.app{display:flex;flex-direction:column;min-height:100vh}
.hdr{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--bd);background:rgba(6,6,16,.95);backdrop-filter:blur(16px);position:sticky;top:0;z-index:400;height:var(--hdr-h)}
.menu-btn{display:inline-flex;background:var(--bg3);border:1px solid var(--bd);color:var(--tx);border-radius:9px;width:40px;height:40px;align-items:center;justify-content:center;font-size:20px;cursor:pointer;flex-shrink:0;transition:.15s;line-height:1;position:relative;z-index:402}
.menu-btn:hover{border-color:var(--ac);color:var(--ac)}.menu-btn:active{transform:scale(.95)}
.side-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:340;animation:fadeIn .2s ease}.side-backdrop.open{display:block}
.hdr-logo{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e84118,#c23616);font-size:22px;color:#fff;box-shadow:0 4px 20px rgba(232,65,24,.35);flex-shrink:0}
.hdr-t{font-weight:800;font-size:19px;letter-spacing:-.4px}.hdr-s{font-size:11px;color:var(--dim);letter-spacing:.3px}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.ebay-btn{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;background:var(--bg3);border:1px solid var(--bd);font-size:13px;font-weight:600;color:var(--tx);cursor:pointer;transition:.15s}
.ebay-btn:hover{border-color:var(--ac)}.ebay-btn.connected{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3);color:var(--grn)}.ebay-btn.expired{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3);color:var(--ylw)}
.auth-btn{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;background:var(--bg3);border:1px solid var(--bd);font-size:13px;font-weight:600;color:var(--tx);cursor:pointer;transition:.15s;white-space:nowrap}
.auth-btn:hover{border-color:var(--ac);color:var(--ac)}.auth-btn.signed-in{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.25);color:var(--grn)}
.auth-btn.signed-in:hover{border-color:var(--grn);background:rgba(34,197,94,.15)}
.layout{display:block;flex:1}
.side{position:fixed;top:var(--hdr-h);left:0;bottom:0;width:230px;max-width:82vw;display:flex;flex-direction:column;gap:3px;padding:12px 10px;background:var(--bg2);z-index:350;overflow-y:auto;border-right:1px solid var(--bd);transform:translateX(-100%);transition:transform .25s ease;box-shadow:4px 0 24px rgba(0,0,0,.4)}
.side.open{transform:translateX(0)}
.side button{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--dim);font-weight:500;font-size:13.5px;text-align:left;transition:.15s;width:100%}
.side button:hover{background:rgba(255,255,255,.03)}.side button.on{background:var(--acG);border-color:rgba(232,65,24,.25);color:var(--ac);font-weight:700}
.side .ico{font-size:17px;width:22px;text-align:center;flex-shrink:0}
.main{padding:24px 22px 90px;min-width:0}
@media(min-width:1100px){.main{padding:28px max(26px,calc((100vw - 1060px)/2)) 90px;}}
@media(min-width:1500px){.main{padding:32px max(36px,calc((100vw - 1140px)/2)) 90px;}}
.inp{padding:10px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--bg3);color:var(--tx);font-size:14px;outline:none;transition:.15s;width:100%}
.inp:focus{border-color:var(--ac)}.inp::placeholder{color:var(--dim)}.inp-big{font-size:17px;font-weight:600;padding:12px 16px}
.btn{padding:10px 22px;border-radius:8px;border:none;font-weight:700;font-size:14px;transition:.15s;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:default}.btn-ac{background:var(--ac);color:#fff}.btn-ac:hover:not(:disabled){background:var(--ac2)}
.btn-grn{background:var(--grn);color:#fff}.btn-dng{background:#dc2626;color:#fff}
.btn-out{background:var(--bg2);color:var(--tx);border:1px solid var(--bd)}.btn-out:hover{border-color:var(--bd2)}
.btn-sm{padding:5px 14px;border-radius:6px;border:none;font-size:12px;font-weight:700;background:var(--ac);color:#fff;cursor:pointer}
.btn-back{margin-bottom:16px;padding:8px 16px;border-radius:8px;background:transparent;border:1px solid var(--bd);color:var(--dim);font-size:13px;cursor:pointer}
.btn-back:hover{border-color:var(--bd2);color:var(--tx)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}.mb{margin-bottom:20px}
.card{background:var(--bg2);border-radius:12px;padding:20px;border:1px solid var(--bd);margin-bottom:16px}
.dim{color:var(--dim)}.hd{font-size:22px;font-weight:700;margin-bottom:20px}.hd3{font-size:15px;font-weight:700;margin-bottom:14px}
.tg{display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--bd)}
.tg button{padding:10px 16px;background:var(--bg2);color:var(--dim);border:none;font-size:13px;font-weight:600;transition:.15s}.tg button.on{background:var(--ac);color:#fff}
.sts{font-size:12px;color:var(--dim);margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.live-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:8px}
.live-card{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:8px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;text-align:left}
.live-card:hover{border-color:var(--t-ac,var(--ac));transform:translateY(-2px);box-shadow:0 8px 20px var(--t-sh,rgba(232,65,24,.2))}
.st-cards{--t-ac:#e84118;--t-acG:rgba(232,65,24,.15);--t-sh:rgba(232,65,24,.2)}
.st-don{--t-ac:#f59e0b;--t-acG:rgba(245,158,11,.15);--t-sh:rgba(245,158,11,.2)}
.st-sealed{--t-ac:#22c55e;--t-acG:rgba(34,197,94,.15);--t-sh:rgba(34,197,94,.2)}
body.st-cards{--t-ac:#e84118;--t-acG:rgba(232,65,24,.15);--t-sh:rgba(232,65,24,.2)}
body.st-don{--t-ac:#f59e0b;--t-acG:rgba(245,158,11,.15);--t-sh:rgba(245,158,11,.2)}
body.st-sealed{--t-ac:#22c55e;--t-acG:rgba(34,197,94,.15);--t-sh:rgba(34,197,94,.2)}
.st-don .inp:focus,.st-sealed .inp:focus{border-color:var(--t-ac)}
.st-don .dd-item.selected,.st-sealed .dd-item.selected{background:var(--t-acG);color:var(--t-ac)}
.st-don .pg-btn.pg-cur,.st-sealed .pg-btn.pg-cur{background:var(--t-ac);border-color:var(--t-ac)}
.st-don .pg-btn:hover:not(:disabled),.st-sealed .pg-btn:hover:not(:disabled){border-color:var(--t-ac);color:var(--t-ac)}
.st-don .pg-jump-go,.st-sealed .pg-jump-go{background:var(--t-ac)}
.st-don .sq-clear:hover,.st-sealed .sq-clear:hover{color:var(--t-ac)}
body.st-don .fab-btn:hover,body.st-sealed .fab-btn:hover{color:var(--t-ac)}
body.st-cards .fab-btn:hover{color:var(--ac)}
body.st-don .pg-jump input:focus,body.st-sealed .pg-jump input:focus{border-color:var(--t-ac)}
.live-card .iw{width:100%;aspect-ratio:.716;background:#000;border-radius:6px;overflow:hidden;margin-bottom:6px}
.live-card .iw.sealed{aspect-ratio:1;background:#fff}
.live-card img{width:100%;height:100%;object-fit:cover;display:block}
.live-card .iw.sealed img{object-fit:contain}
.live-grid-spacer{visibility:hidden;pointer-events:none}
.live-card .n{font-weight:700;font-size:12px;margin-bottom:3px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;height:calc(1.3em * 2);word-break:break-word}
.live-card .s{font-size:10px;color:var(--dim);margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:1.25em}
.live-card .pv{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;min-height:16px}
.live-card .var{font-size:9.5px;color:var(--dim);font-weight:700;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.live-card .var.foil{color:#c084fc}.live-card .p{font-size:12px;color:#60a5fa;font-weight:700;white-space:nowrap;flex-shrink:0}
.live-sec{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--dim);letter-spacing:.5px;margin:20px 0 10px}.live-sec:first-child{margin-top:0}
.live-sec-count{color:var(--dim);font-weight:600}
/* search controls */
.search-controls{max-width:820px;margin:0 auto}
.type-tabs{display:flex;justify-content:center;margin-bottom:10px}
.type-tabs-inner{display:inline-flex;border-radius:9px;overflow:hidden;border:1px solid var(--bd)}
.type-tab{padding:9px 24px;background:var(--bg2);color:var(--dim);border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.type-tab:not(:last-child){border-right:1px solid var(--bd)}
.type-tab:hover:not(.on){background:var(--bg3);color:var(--tx)}
.type-tab[data-type="cards"].on{background:var(--ac);color:#fff}
.type-tab[data-type="don"].on{background:var(--ylw);color:#1a1a1a}
.type-tab[data-type="sealed"].on{background:var(--grn);color:#fff}
.search-row{display:flex;gap:10px;align-items:stretch;margin-bottom:14px;flex-wrap:wrap}
.search-row .inp-wrap{flex:1;min-width:200px;display:flex}
.sq-wrap{position:relative;display:flex;align-items:center;width:100%}
.sq-wrap .inp{padding-right:38px;width:100%}
.sq-clear{position:absolute;right:10px;background:none;border:none;color:var(--dim);font-size:14px;cursor:pointer;padding:4px;line-height:1;transition:.15s;display:none;align-items:center;justify-content:center;border-radius:4px}
.sq-clear.vis{display:flex}
.sq-clear:hover{color:var(--tx);background:rgba(255,255,255,.06)}
.search-row .sort-wrap{flex:0 0 auto;display:flex;min-width:200px}
.search-row .sort-wrap .inp{height:100%;display:flex;align-items:center;white-space:nowrap;width:100%}
.pg-wrap{margin-top:20px}
.pg-bar{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap}
.pg-btn{padding:7px 13px;border-radius:7px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;min-width:36px;text-align:center;line-height:1}
.pg-btn:hover:not(:disabled){border-color:var(--ac);color:var(--ac)}.pg-btn:disabled{opacity:.35;cursor:default}
.pg-btn.pg-cur{background:var(--ac);color:#fff;border-color:var(--ac);cursor:default;pointer-events:none}
.pg-ellipsis{padding:7px 5px;color:var(--dim);font-size:13px;cursor:default;user-select:none}
.pg-sub{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px;flex-wrap:wrap}
.pg-info{font-size:12px;color:var(--dim)}
.pg-jump{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.pg-jump input{width:50px;padding:5px 8px;border-radius:6px;border:1px solid var(--bd);background:var(--bg3);color:var(--tx);font-size:12px;text-align:center;outline:none;font-family:inherit;-moz-appearance:textfield;appearance:textfield}
.pg-jump input::-webkit-outer-spin-button,.pg-jump input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pg-jump input:focus{border-color:var(--ac)}
.pg-jump-go{padding:5px 0;border-radius:6px;border:none;background:var(--ac);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:max-width .2s ease,opacity .2s ease,padding .2s ease;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;vertical-align:middle}
.pg-jump-go.vis{max-width:60px;opacity:1;padding:5px 11px}
.pg-jump-go:hover{background:var(--ac2)}
#fab-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;z-index:200;display:flex;flex-direction:row;border-radius:10px;overflow:hidden;border:1px solid var(--bd);background:var(--bg2);box-shadow:0 4px 16px rgba(0,0,0,.4);transition:opacity .22s ease}
#fab-wrap.fab-gone{opacity:0;pointer-events:none}
body.drawer-open #fab-wrap{opacity:0;pointer-events:none}
.fab-btn{height:40px;width:40px;max-width:0;overflow:hidden;opacity:0;pointer-events:none;border:none;background:transparent;color:var(--tx);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;font-family:inherit;flex-shrink:0;transition:max-width .22s ease,opacity .22s ease}
.fab-btn:hover{color:var(--ac)}.fab-btn.fab-on{max-width:40px;opacity:1;pointer-events:auto}
#fab-up.fab-on+#fab-down.fab-on{border-left:1px solid var(--bd)}
/* Sign-in page */
.signin-page{max-width:440px;margin:40px auto;animation:fadeIn .25s ease}
.signin-tabs{display:flex;justify-content:center;margin-bottom:28px}
.signin-tabs-inner{display:inline-flex;border-radius:9px;overflow:hidden;border:1px solid var(--bd)}
.signin-tab{padding:10px 32px;background:var(--bg2);color:var(--dim);border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.signin-tab:first-child{border-right:1px solid var(--bd)}
.signin-tab:hover:not(.on){background:var(--bg3);color:var(--tx)}
.signin-tab.on{background:var(--ac);color:#fff}
.signin-card{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:28px 28px 24px}
.signin-title{font-size:20px;font-weight:800;margin-bottom:6px}
.signin-sub{font-size:13px;color:var(--dim);margin-bottom:22px}
.signin-field{margin-bottom:16px}
.signin-field label{display:block;font-size:12px;font-weight:700;color:var(--dim);margin-bottom:6px;letter-spacing:.4px;text-transform:uppercase}
.signin-row{display:flex;gap:12px}
.signin-row .signin-field{flex:1;min-width:0}
.signin-err{background:rgba(220,38,38,.12);border:1px solid rgba(220,38,38,.3);color:#fca5a5;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.signin-err.vis{display:block}
.signout-section{border-top:1px solid var(--bd);margin-top:20px;padding-top:20px;text-align:center}
.det-grid{display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:start}
.det-iw{position:sticky;top:90px}.det-img{width:100%;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.6);background:var(--bg3);cursor:zoom-in;transition:.15s}.det-img:hover{opacity:.9}
.det-t{font-size:21px;font-weight:700;margin-bottom:4px}.det-m{font-size:13px;color:var(--dim);margin-bottom:18px;line-height:1.6}
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.st-l{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}.st-v{font-weight:700;font-size:18px}.st-vb{font-weight:700;font-size:26px}
.ext-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:13px}
.desc-t{margin-top:10px;font-size:13px;color:var(--dim);line-height:1.6;border-top:1px solid var(--bd);padding-top:10px}
.code-blk{padding:14px;border-radius:8px;background:#08081a;border:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:12px;color:#a5b4fc;cursor:pointer;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow:auto;line-height:1.7;transition:.15s}.code-blk:hover{border-color:var(--ac)}
.tbl-w{background:var(--bg2);border-radius:12px;border:1px solid var(--bd);overflow:hidden;overflow-x:auto}
table{width:100%;border-collapse:collapse}th{padding:12px 16px;text-align:left;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--bd)}
td{padding:10px 16px;font-size:14px;border-bottom:1px solid var(--bd);vertical-align:top}tr:last-child td{border-bottom:none}
.empty{text-align:center;padding:48px 20px;color:var(--dim);line-height:1.8}
.err{color:#fca5a5;padding:14px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:8px;margin-top:10px}
.info-bar{color:#93c5fd;padding:12px;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:8px;margin-bottom:14px;font-size:13px;line-height:1.5}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 22px;border-radius:10px;color:#fff;font-weight:600;font-size:14px;z-index:9999;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:slideUp .25s ease;pointer-events:none;max-width:400px}
.field{display:flex;flex-direction:column;gap:4px;min-width:160px;flex:1}
.field label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.5px}
.badge-card{background:rgba(232,65,24,.15);color:var(--ac)}.badge-don{background:rgba(245,158,11,.15);color:var(--ylw)}.badge-sealed{background:rgba(34,197,94,.15);color:var(--grn)}.badge-variant{background:rgba(147,51,234,.15);color:#c084fc;margin-left:6px}
.link-card{background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:10px}
.link-title{font-weight:700;font-size:14px;margin-bottom:6px;word-break:break-word}.link-sub{font-size:12px;color:var(--dim);line-height:1.6}
.link-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease;cursor:pointer}
.modal-bg.lightbox{cursor:zoom-out}
.modal{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:24px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;cursor:default}
.modal-t{font-size:18px;font-weight:700;margin-bottom:16px}
.lightbox-img{max-width:90vw;max-height:85vh;border-radius:12px;box-shadow:0 12px 60px rgba(0,0,0,.8);cursor:default}
.dropdown{position:relative}
.dropdown-trigger{display:flex;align-items:center;justify-content:space-between;cursor:pointer;text-align:left;gap:8px}
.dropdown-trigger .dd-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx)}
.dropdown-trigger .dd-caret{color:var(--dim);font-size:10px;flex-shrink:0;transition:transform .15s}
.dropdown.open .dd-caret{transform:rotate(180deg)}
.dropdown-menu{position:absolute;top:calc(100% + 4px);right:0;left:auto;width:200px;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:6px;z-index:50;box-shadow:0 12px 28px rgba(0,0,0,.5);max-height:320px;overflow-y:auto;display:block!important;opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .18s ease,transform .18s ease}
.dropdown.open .dropdown-menu{opacity:1;transform:none;pointer-events:auto}
.dd-item.selected{background:var(--t-acG,var(--acG));color:var(--t-ac,var(--ac));font-weight:700}
.dd-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;cursor:pointer;font-size:14px;user-select:none;color:var(--tx)}
.dd-item:hover{background:var(--bg3)}.dd-item input{accent-color:var(--ac);width:16px;height:16px;cursor:pointer;flex-shrink:0}

.dd-sep{border:none;border-top:1px solid var(--bd);margin:4px 0}
.dd-sub{display:flex;gap:4px;padding:2px 12px 10px 38px;flex-wrap:wrap;transition:opacity .15s}
.dd-pill{padding:3px 11px;border-radius:20px;border:1px solid var(--bd);background:transparent;color:var(--dim);font-size:11px;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit;line-height:1.6}

<script src="config.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════
   CONFIG — edit this before uploading to Cloudflare Pages
   ════════════════════════════════════════════════════════════
   LOCAL:      leave TCG_API_URL as empty string ''
               the app auto-detects http://localhost:3000

   CLOUDFLARE: set TCG_API_URL to your server's public URL
               e.g. 'https://myserver.example.com'
               or   'http://123.456.78.90:3000'
               (your Node.js server must be publicly reachable)
═══════════════════════════════════════════════════════════ */
window.TCG_API_URL = '';   // ← change this line before uploading to Cloudflare

/* ═══ ADMIN CONFIG — change to your chosen admin username ═══ */
var ADMIN_USERNAME = 'xottic_56'; // ← set this to the username you register as admin

/* ═══ STATE ═══ */
var DB=null,LINKED_LISTINGS={},BOX_PRESETS=[],USER_ZIP='',EBAY_AUTH={};
var currentUser=null; // {username,email,firstName,lastName,isAdmin}
function loadStorage(){
  try{LINKED_LISTINGS=JSON.parse(localStorage.getItem('ll')||'{}');}catch(e){}
  try{BOX_PRESETS=JSON.parse(localStorage.getItem('bp')||'[]');}catch(e){}
  try{EBAY_AUTH=JSON.parse(localStorage.getItem('ea')||'{}');}catch(e){}
  if(!EBAY_AUTH.accessToken)EBAY_AUTH={accessToken:'',refreshToken:'',expiresAt:0,username:''};
  USER_ZIP=localStorage.getItem('uz')||'';
  try{var s=localStorage.getItem('tcg_session');if(s)currentUser=JSON.parse(s);}catch(e){}
}
function saveStorage(){
  localStorage.setItem('ll',JSON.stringify(LINKED_LISTINGS));
  localStorage.setItem('bp',JSON.stringify(BOX_PRESETS));
  localStorage.setItem('ea',JSON.stringify(EBAY_AUTH));
  localStorage.setItem('uz',USER_ZIP);
}

/* ═══ CALCULATOR ═══ */
function calcListing(net,cs){
  var D=1-0.1325-0.1325*0.1011,S=0.1325+0.1325*0.1011,b=cs!=null?cs:0.74;
  for(var i=0;i<10;i++){
    var aL=(net+0.3+S*b)/D,tot=aL+b+0.1011*(aL+b),a,c;
    if(tot>=10.01){c=0.4;a=(net+0.4+S*b)/D;}else{c=0.3;a=aL;}
    if(cs!=null)return{lp:a,ship:b,c:c,cat:'CUSTOM',rule:'Custom $'+b.toFixed(2)};
    var need=a<=20?0.74:5.89;
    if(Math.abs(b-need)<0.001)return{lp:a,ship:b,c:c,cat:a<=20?'LOW':'HIGH',rule:a<=20?'≤$20 → $0.74':'> $20 → $5.89'};
    b=need;
  }
  return null;
}
function vNet(a,b,c){return a*(1-0.1325-0.1325*0.1011)-c-(0.1325+0.1325*0.1011)*b;}
function tcgImg(pid){return apiBase()+'/api/img-proxy?url='+encodeURIComponent('https://tcgplayer-cdn.tcgplayer.com/product/'+pid+'_in_1000x1000.jpg');}
function proxyImg(url){if(!url)return'';return apiBase()+'/api/img-proxy?url='+encodeURIComponent(url);}
function getCardImg(item){var img=(item&&item.customImage)?item.customImage:null;if(!img)return proxyImg('https://tcgplayer-cdn.tcgplayer.com/product/'+item.productId+'_in_1000x1000.jpg');if(img.startsWith('/img-cache/'))return apiBase()+img;return proxyImg(img);}
function getCardImgGrid(item){return proxyImg('https://tcgplayer-cdn.tcgplayer.com/product/'+item.productId+'_200w.jpg');}
function applyMod(p,m){switch(m){case 2:return Math.ceil(p*10)/10;case 3:return Math.ceil(p);case 4:return Math.ceil(p/5)*5;default:return p;}}
function modName(m){return['Skip','Near 10¢','Near $1','Near $5'][m-1]||'?';}
function finalPrice(mkt,opt,mod,disp,sp){
  var o=opt===1?mkt:calcListing(mkt,sp).lp,mn=Math.max(0.99,o),md=applyMod(mn,mod);
  if(disp){var d='$'+md.toFixed(2);if(o<0.99)d+=' (min $0.99)';else if(mn!==md)d+=' (orig $'+o.toFixed(2)+')';return d;}
  return md;
}

/* ═══ CARD NAME ENGINE ═══ */
function hasSub(a,b){a=a.toUpperCase().replace(/[^A-Z0-9]/g,'');b=b.toUpperCase().replace(/[^A-Z0-9]/g,'');for(var l=3;l<=Math.min(a.length,b.length);l++)for(var i=0;i<=a.length-l;i++)if(b.indexOf(a.substring(i,i+l))>=0)return true;return false;}
function parseCardName(card){
  var ext=card.extendedData||[],fn=(card.name||'').trim(),pC=[],pO=[],pR=/\s*\(([^)]+)\)\s*$/,m;
  while((m=fn.match(pR))){pO.unshift(m[1].trim());pC.unshift(m[1].trim().toUpperCase());fn=fn.replace(pR,'').trim();}
  var sfn='',sR=/\s*-\s*([A-Z0-9-]+)$/,sm=fn.match(sR);if(sm){sfn=sm[1].trim();fn=fn.replace(sR,'').trim();}
  var bn=fn.trim(),numE=ext.find(function(e){return e.name==='Number';}),num=numE?numE.value.trim():(sfn||'');
  var vars=[],ends=[],suf=[];
  pC.forEach(function(pc,i){var orig=pO[i];if(hasSub(pc,num))return;if(pc.indexOf('REPRINT')>=0)ends.push(' (REPRINT)');else if(pc.indexOf('ALTERNATE ART')>=0||pc.indexOf('PARALLEL')>=0)vars.push('ALT ART ');else if(pc==='FULL ART')vars.push('FULL ART ');else if(pc==='MANGA')vars.push('MANGA ');else if(pc==='SP')vars.push('SP ');else if(pc.indexOf('WANTED POSTER')>=0){vars.push('SP ');suf.push(' ('+orig+')');}else if(/^\d+$/.test(pc)||pc.indexOf('OP-')>=0||pc.indexOf('ST-')>=0||pc.indexOf('P-')>=0){}else suf.push(' ('+orig+')');});
  bn=bn.replace(/\s*\(([^)]+)\)/g,function(m2,c){var pc=c.trim().toUpperCase();if(hasSub(pc,num)||/^\d+$/.test(pc)||pc.indexOf('OP-')>=0||pc.indexOf('ST-')>=0||pc.indexOf('P-')>=0)return '';return m2;}).trim().replace(/-\s*[A-Z0-9-]+\s*$/g,'').trim();
  var colE=ext.find(function(e){return e.name==='Color';}),col=colE?colE.value.toUpperCase():'';
  return{bn:bn,suf:suf,vars:vars,ends:ends,num:num,col:col};
}
function shortName(c){var p=parseCardName(c);return p.bn+p.suf.join('')+' English ('+p.col+') '+p.vars.join('')+p.num+p.ends.join('');}
function autoTitle(c){var p=parseCardName(c);return p.bn+p.suf.join('')+' English ('+p.col+') '+p.vars.join('')+p.num+' card One Piece CCG'+p.ends.join('');}
function autoBodyCard(c,t){var ext=c.extendedData||[],eD=ext.find(function(e){return e.name==='Description';}),eff=eD?eD.value:'',sp='';ext.forEach(function(e){if(e.name!=='Description'&&e.value&&e.value.trim())sp+='* '+(e.displayName||e.name)+': '+e.value+'<br>';});return'<div><b>'+t+'</b></div><div><br></div><b>Card Specifications:</b><br>'+(eff?eff+'<br>':'')+sp+'<div><br><b>Shipping:</b><br>This card will be sleeved, sandwiched between cardboard, and sealed in a bag. The item will be shipped in an envelope during transport.</div>';}
function autoBodyDon(p,t){var ext=p.extendedData||[],eD=ext.find(function(e){return e.name==='Description';}),eff=eD?eD.value:'',sp='';ext.forEach(function(e){if(e.name!=='Description'&&e.value&&e.value.trim())sp+='* '+(e.displayName||e.name)+': '+e.value+'<br>';});var d=(eff||sp)?'<b>Card Specifications:</b><br>'+(eff?'* Description: '+eff+'<br>':'')+sp:'';return'<div><b>'+t+'</b></div><div><br></div>'+(d?d+'<div><br></div>':'')+'<div><b>Shipping:</b><br>This card will be sleeved, sandwiched between cardboard, and sealed in a bag. The item will be shipped in an envelope during transport.</div>';}
function autoBodySealed(p,t){var sl=p.setName?'* Set: '+p.setName+'<br>':'';return'<div><b>'+t+'</b></div><div><br></div>'+(sl?'<b>Product Details:</b><br>'+sl+'<div><br></div>':'')+'<div><b>Shipping:</b><br>This item will be securely packaged to prevent damage during transport.</div>';}
function decodeHtmlEntities(str){if(str==null)return'';var ta=document.createElement('textarea');ta.innerHTML=String(str);return ta.value;}
function sanitizeDetailHtml(str){if(str==null)return'';var html=decodeHtmlEntities(str);html=html.replace(/\r\n|\r|\n/g,'<br>');html=html.replace(/<script[\s\S]*?<\/script>/gi,'');html=html.replace(/on[a-z]+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi,'');return html;}
function isFoilVariantName(v){return /foil|holo|parallel/i.test(v||'');}
function variantMatchesFilter(variant,wanted){var v=(variant||'').toLowerCase();if(wanted==='normal')return v==='normal';if(wanted==='foil')return v==='foil'||v.includes('foil')||v.includes('holo')||v.includes('parallel');return true;}

/* ═══ UTILS ═══ */
function $(id){return document.getElementById(id);}
function h(t,c,i){var e=document.createElement(t);if(c)e.className=c;if(i!=null)e.innerHTML=i;return e;}
function esc(s){if(s==null)return'';var d=document.createElement('div');d.textContent=String(s);return d.innerHTML;}
function showToast(m,ok){var t=h('div','toast',m);t.style.background=ok?'#16a34a':'#dc2626';$('toast-container').appendChild(t);setTimeout(function(){t.remove();},3000);}
function copyTxt(t){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){showToast('Copied!',true);}).catch(function(){fbCp(t);});else fbCp(t);}
function fbCp(t){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('Copied!',true);}
function openModal(c){var mr=$('modal-root');mr.innerHTML='';var bg=h('div','modal-bg');var m=h('div','modal');m.innerHTML=c;bg.appendChild(m);bg.onclick=function(e){if(e.target===bg)closeModal();};mr.appendChild(bg);return m;}
function closeModal(){$('modal-root').innerHTML='';}
function debounce(fn,ms){var t;return function(){var a=arguments,th=this;clearTimeout(t);t=setTimeout(function(){fn.apply(th,a);},ms);};}
function apiBase(){
  /* Priority: explicit config > file:// fallback > same-origin */
  if(window.TCG_API_URL) return window.TCG_API_URL.replace(/\/+$/, '');
  if(window.location.protocol === 'file:') return 'http://localhost:3000';
  return window.location.origin;
}
function apiPost(url,body){return fetch(apiBase()+url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});}
function apiDel(url){return fetch(apiBase()+url,{method:'DELETE'}); }

function openLightbox(imgSrc){var mr=$('modal-root');mr.innerHTML='';var bg=h('div','modal-bg lightbox');var img=document.createElement('img');img.src=imgSrc;img.className='lightbox-img';bg.appendChild(img);bg.onclick=function(e){if(e.target===bg)mr.innerHTML='';};mr.appendChild(bg);}
async function saveImage(imgSrc,name){showToast('Downloading…',true);var blob=null;try{var r=await fetch(imgSrc,{mode:'cors'});if(r.ok)blob=await r.blob();}catch(e){}if(!blob){showToast('Download failed',false);return;}var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=(name||'card')+'.jpg';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url);},200);showToast('Downloaded!',true);}

/* ═══ EBAY BADGE ═══ */
function renderEbayBtn(){
  var el=$('ebay-btn');if(!el)return;
  var c=EBAY_AUTH.accessToken&&EBAY_AUTH.expiresAt>Date.now(),x=EBAY_AUTH.accessToken&&EBAY_AUTH.expiresAt<=Date.now();
  if(c){el.className='ebay-btn connected';el.innerHTML='<span class="dot" style="background:#22c55e"></span><span>eBay: '+esc(EBAY_AUTH.username||'Connected')+'</span>';}
  else if(x){el.className='ebay-btn expired';el.innerHTML='<span class="dot" style="background:#f59e0b"></span><span>Token Expired</span>';}
  else{el.className='ebay-btn';el.innerHTML='<span>🔐</span><span>Sign in with eBay</span>';}
}

/* ═══ SERVER STATUS ═══ */
var searchStatus='idle',serverStatus={},statusPollTimer=null;
function updateSearchStatusEl(){
  var el=$('sts-txt');if(!el)return;
  var stColor=searchStatus==='ready'?'#22c55e':searchStatus.includes('Error')?'#ef4444':'#eab308';
  var dot=el.parentNode&&el.parentNode.querySelector('.dot');if(dot)dot.style.background=stColor;
  var base=searchStatus==='ready'?'One Piece DB loaded ('+DB.cardMap.size+' serials, '+(DB.sealed.length+DB.don.length)+' products)':searchStatus;
  var extra='';
  if(serverStatus.updateRunning)extra=' · Server: '+(serverStatus.updateLog||'Updating…');
  else if(serverStatus.scrapeRunning)extra=' · '+serverStatus.scrapeLog;
  else if(serverStatus.pendingUpdateAt&&serverStatus.pendingUpdateAt>Date.now()){var mins=Math.max(1,Math.round((serverStatus.pendingUpdateAt-Date.now())/60000));extra=' · Update pending ~'+mins+'min';}
  el.textContent=base+extra;
}
function startStatusPolling(){if(statusPollTimer)return;statusPollTimer=setInterval(pollServerStatus,30000);}

/* ═══ AUTH — server-backed, works across all devices ═══ */
function hashStr(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h)^s.charCodeAt(i);return(h>>>0).toString(36);}
async function authSignIn(identifier,password){
  try{
    var r=await fetch(apiBase()+'/api/auth/signin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:identifier,password:hashStr(password)})});
    var d=await r.json();
    if(!r.ok)return{error:d.error||'Sign in failed'};
    currentUser={username:d.username,email:d.email,firstName:d.firstName,lastName:d.lastName,isAdmin:d.username.toLowerCase()===ADMIN_USERNAME.toLowerCase()};
    localStorage.setItem('tcg_session',JSON.stringify(currentUser));
    return{user:currentUser};
  }catch(e){return{error:'Could not reach server'};}
}
async function authSignUp(email,firstName,lastName,username,password){
  try{
    var r=await fetch(apiBase()+'/api/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,firstName:firstName,lastName:lastName,username:username,password:hashStr(password)})});
    var d=await r.json();
    if(!r.ok)return d.error||'Sign up failed';
    currentUser={username:d.username,email:d.email,firstName:d.firstName,lastName:d.lastName,isAdmin:d.username.toLowerCase()===ADMIN_USERNAME.toLowerCase()};
    localStorage.setItem('tcg_session',JSON.stringify(currentUser));
    return null;
  }catch(e){return'Could not reach server';}
}
function authSignOut(){currentUser=null;localStorage.removeItem('tcg_session');renderAuthBtn();navigateTo('search');}
function renderAuthBtn(){
  var el=$('auth-btn');if(!el)return;
  if(currentUser){
    el.className='auth-btn signed-in';
    el.innerHTML='<span>👤</span><span class="auth-lbl">'+esc(currentUser.username)+'</span>';
    el.onclick=function(){navigateTo('signin');};
  } else {
    el.className='auth-btn';
    el.innerHTML='<span>🔑</span><span class="auth-lbl">Sign In</span>';
    el.onclick=function(){navigateTo('signin');};
  }
}

/* ═══ ROUTING ═══ */
var _pendingProductUid=null;
function navigateTo(route,replace){
  if(replace)history.replaceState(null,'','#'+route);
  else history.pushState(null,'','#'+route);
  applyRoute(route);
}
function applyRoute(route){
  var parts=(route||'search/cards').split('/');
  var tab=parts[0]||'search';
  if(tab==='signin'){currentTab='signin';initSidebar();toggleMenu(false);clearFabListeners();renderSignIn($('main'));return;}
  var adminOnly=['editcsv','settings'];
  if(adminOnly.indexOf(tab)>=0&&(!currentUser||!currentUser.isAdmin)){navigateTo('search',true);return;}
  var tabIds=TABS.map(function(t){return t.id;});
  if(tabIds.indexOf(tab)<0)tab='search';
  currentTab=tab;initSidebar();toggleMenu(false);clearFabListeners();
  var m=$('main');m.innerHTML='';
  if(tab==='search'){
    // FIX 2: only restore searchSel if URL explicitly contains /p/
    if(parts[1]&&['cards','don','sealed'].indexOf(parts[1])>=0)searchType=parts[1];
    var hasProduct=parts[2]==='p'&&parts[3];
    if(hasProduct){
      if(DB){var p=DB.byUid.get(parts[3]);if(p){searchSel=p;searchCustShip='';} else searchSel=null;}
      else{_pendingProductUid=parts[3];searchSel=null;}
    } else {
      searchSel=null; // always clear when no /p/ in URL
    }
    renderSearch(m);
  } else {
    document.body.classList.remove('st-cards','st-don','st-sealed');
    ({editcsv:renderEditCSV,linked:renderLinked,presets:renderPresets,calc:renderCalc,quick:renderQuick,batch:renderBatch,ebay:renderEbay,settings:renderSettings,info:renderInfo})[tab](m);
    initNonSearchFabs();
  }
}
window.addEventListener('popstate',function(e){
  var st=e.state;
  if(st&&st._search){
    searchType=st.st||'cards';searchPage=st.sp||0;searchQ=st.sq||'';
    searchSel=null;currentTab='search';initSidebar();
    setTypeBodyClass(searchType);renderSearch($('main'));
  } else {
    applyRoute(location.hash.slice(1)||'search/cards');
  }
});

/* ═══ TABS ═══ */
var TABS=[
  {id:'search',  label:'Card Search',      icon:'🔍'},
  {id:'editcsv', label:'Edit CSV Database', icon:'✏️', adminOnly:true},

var _fabTopVis=false,_fabBotVis=false,_fabObsSearch=null,_fabObsPg=null,_fabScrollFn=null;
function updateFabs(){var wrap=$('fab-wrap'),up=$('fab-up'),dn=$('fab-down');if(!wrap||!up||!dn)return;up.classList.toggle('fab-on',_fabTopVis);dn.classList.toggle('fab-on',_fabBotVis);wrap.classList.toggle('fab-gone',!_fabTopVis&&!_fabBotVis);}
function clearFabListeners(){if(_fabObsSearch){_fabObsSearch.disconnect();_fabObsSearch=null;}if(_fabObsPg){_fabObsPg.disconnect();_fabObsPg=null;}if(_fabScrollFn){window.removeEventListener('scroll',_fabScrollFn);_fabScrollFn=null;}_fabTopVis=false;_fabBotVis=false;updateFabs();}
function initFabObservers(){
  clearFabListeners();
  var sq=$('sq-sentinel'),pg=$('pg-sentinel');
  if(sq){_fabObsSearch=new IntersectionObserver(function(e){_fabTopVis=!e[0].isIntersecting;updateFabs();},{threshold:0});_fabObsSearch.observe(sq);}

}
function initNonSearchFabs(){

function renderLiveGrid(){
  var el=$('search-content');if(!el)return;
  if(!DB||searchStatus!=='ready'){el.innerHTML='<div class="empty"><span class="spinner"></span> Loading database…</div>';return;}
  var q=searchQ.trim().toUpperCase(),qL=q.toLowerCase();
  var PAGE=80,results=[];
  if(searchType==='cards'){
    if(!q){results=DB.allCards.slice();}
    else{var seen={};DB.cardMap.forEach(function(cards,key){if(key.indexOf(q)===0)cards.forEach(function(c){if(!seen[c.uid]){seen[c.uid]=1;results.push(c);}});});if(results.length===0)DB.cardMap.forEach(function(cards,key){if(key.indexOf(q)>=0)cards.forEach(function(c){if(!seen[c.uid]){seen[c.uid]=1;results.push(c);}});});if(results.length<500)for(var i=0;i<DB.allCards.length&&results.length<500;i++){var c=DB.allCards[i];if(!seen[c.uid]&&c.name.toLowerCase().indexOf(qL)>=0){seen[c.uid]=1;results.push(c);}}}
  }else if(searchType==='don'){results=q?DB.don.filter(function(p){return p.name.toLowerCase().indexOf(qL)>=0;}):DB.don.slice();}
  else{results=q?DB.sealed.filter(function(p){return p.name.toLowerCase().indexOf(qL)>=0;}):DB.sealed.slice();}
  function pSort(a,b){var ap=a.marketPrice>0?a.marketPrice:null,bp=b.marketPrice>0?b.marketPrice:null;if(ap===null&&bp===null)return 0;if(ap===null)return 1;if(bp===null)return -1;return searchSort==='low-high'?ap-bp:bp-ap;}
  function bms(item){if(!q)return 0;var name=item.name.toLowerCase(),number=(item.number||'').toLowerCase();if(number===qL)return 100;if(number.startsWith(qL))return 80;if(name===qL)return 70;if(name.startsWith(qL))return 60;if(name.includes(qL))return 30;return 0;}
  if(searchSort==='best')results.sort(function(a,b){return bms(b)-bms(a);});else results.sort(pSort);
  var total=results.length;
  if(total===0){el.innerHTML='<div class="empty">No results'+(q?' for "'+esc(searchQ)+'"':'')+'</div>';setTimeout(initFabObservers,60);return;}
  var maxPage=Math.max(0,Math.ceil(total/PAGE)-1);
  if(searchPage>maxPage)searchPage=maxPage;
  var page=results.slice(searchPage*PAGE,(searchPage+1)*PAGE);
  var isSealed=searchType==='sealed';
  function priceCell(p){return p.marketPrice>0?'$'+p.marketPrice.toFixed(2):'<span class="dim">N/A</span>';}
  function variantCell(p){if(isSealed||!p.variant||!p.isSplit)return'<span class="var"></span>';var isFoil=isFoilVariantName(p.variant);return'<span class="var'+(isFoil?' foil':'')+'">'+esc(p.variant)+'</span>';}
  function imgTag(item){return'<img src="'+esc(getCardImgGrid(item))+'" onerror="imgFail(this)" loading="lazy">';}
  var html='<div class="live-sec">'+secBadge(searchType)+'<span class="live-sec-count">('+total+')</span></div><div class="live-grid" id="live-grid-el">';
  page.forEach(function(item){
    var sub=searchType==='cards'?esc(item.number||''):esc(item.setName||'');
    html+='<div class="live-card" data-uid="'+esc(item.uid)+'"><div class="iw'+(isSealed?' sealed':'')+'">'+imgTag(item)+'</div>';
    html+='<div class="n" title="'+esc(item.name)+'">'+esc(item.name)+'</div><div class="s">'+sub+'</div>';
    html+='<div class="pv">'+variantCell(item)+'<span class="p">'+priceCell(item)+'</span></div></div>';
  });
  html+='</div>';
  if(total>PAGE){
    var cur=searchPage,mp=maxPage,tp=mp+1,nums=[],seenN={};
    function addN(n){if(n<0||n>mp||seenN[n])return;seenN[n]=1;nums.push(n);}
    addN(0);if(cur-1>1)nums.push(-1);if(cur-1>0)addN(cur-1);addN(cur);if(cur+1<mp)addN(cur+1);if(cur+2<mp)nums.push(-1);if(cur<mp)addN(mp);
    html+='<div id="pg-sentinel" style="height:1px"></div>';
    html+='<div class="pg-wrap"><div class="pg-bar">';
    html+='<button class="pg-btn" id="pg-prev"'+(cur===0?' disabled':'')+'>← Prev</button>';
    nums.forEach(function(n){if(n===-1)html+='<span class="pg-ellipsis">…</span>';else html+='<button class="pg-btn'+(n===cur?' pg-cur':'')+'" data-pg="'+n+'">'+(n+1)+'</button>';});
    html+='<button class="pg-btn" id="pg-next"'+(cur>=mp?' disabled':'')+'>Next →</button></div>';
    html+='<div class="pg-sub"><span class="pg-info">Page '+(cur+1)+' of '+tp+'</span>';
    html+='<span class="pg-jump"><span>Jump to:</span><input id="pg-jump-inp" inputmode="numeric" placeholder="#"><button class="pg-jump-go" id="pg-jump-go">Go</button></span></div></div>';
  }else{html+='<div id="pg-sentinel" style="height:1px"></div>';}
  el.innerHTML=html;
  var grid=el.querySelector('#live-grid-el');
  if(grid){var cols=window.getComputedStyle(grid).gridTemplateColumns.split(' ').length,rem=page.length%cols;if(rem>0)for(var si=0;si<cols-rem;si++){var sp=document.createElement('div');sp.className='live-card live-grid-spacer';grid.appendChild(sp);}}
  el.querySelectorAll('[data-uid]').forEach(function(card){
    card.onclick=function(){
      var p=DB.byUid.get(this.getAttribute('data-uid'));
      if(p){searchSel=p;searchCustShip='';replaceSearchState();history.pushState(null,'','#search/'+searchType+'/p/'+p.uid);renderSearch($('main'));window.scrollTo({top:0,behavior:'smooth'});}
    };
  });
  function goPage(n){searchPage=Math.max(0,Math.min(maxPage,n));pushSearchState();renderLiveGrid();window.scrollTo({top:0,behavior:'smooth'});}
  var pp=el.querySelector('#pg-prev'),pn=el.querySelector('#pg-next');
  if(pp)pp.onclick=function(){goPage(searchPage-1);};
  if(pn)pn.onclick=function(){goPage(searchPage+1);};
  el.querySelectorAll('[data-pg]').forEach(function(btn){btn.onclick=function(){goPage(parseInt(this.getAttribute('data-pg')));};});
  var ji=el.querySelector('#pg-jump-inp'),goBtn=el.querySelector('#pg-jump-go');
  if(ji&&goBtn){
    ji.oninput=function(){this.value=this.value.replace(/[^0-9]/g,'');goBtn.classList.toggle('vis',parseInt(this.value)>=1&&parseInt(this.value)<=maxPage+1);};
    ji.onkeydown=function(e){if(e.key==='Enter'){var v=parseInt(this.value);if(!isNaN(v))goPage(v-1);}};
    goBtn.onclick=function(){var v=parseInt(ji.value);if(!isNaN(v))goPage(v-1);};
  }
  setTimeout(initFabObservers,60);
}

    var params='?q='+encodeURIComponent(editSearchQ)
      +'&type='+editTypeFilter+'&sort='+editSortMode
      +'&tag='+encodeURIComponent(tagParam)
      +'&page='+editPage;

/* ── Pagination bar HTML ──────────────────────────────────────────────────── */
function paginationBar(id_suffix){
  var totalPages=Math.ceil(editTotal/EDIT_PAGE)||1;
  var cur=editPage;
  var showing=editItems.length;
  var from=cur*EDIT_PAGE+1, to=Math.min((cur+1)*EDIT_PAGE,editTotal);
  var html='<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 0" id="ev-pgbar-'+id_suffix+'">';
  html+='<button class="btn btn-out" style="padding:5px 10px;font-size:12px" data-pg="first" '+(cur===0?'disabled':'')+'>«</button>';
  html+='<button class="btn btn-out" style="padding:5px 10px;font-size:12px" data-pg="prev"  '+(cur===0?'disabled':'')+'>‹</button>';
  html+='<span class="dim" style="font-size:12px;padding:0 6px">Page '+(cur+1)+' / '+totalPages+'  ('+from+'–'+to+' of '+editTotal+')</span>';
  html+='<button class="btn btn-out" style="padding:5px 10px;font-size:12px" data-pg="next" '+(cur>=totalPages-1?'disabled':'')+'>›</button>';
  html+='<button class="btn btn-out" style="padding:5px 10px;font-size:12px" data-pg="last" '+(cur>=totalPages-1?'disabled':'')+'>»</button>';
  html+='</div>';
  return html;
}
function wirePagination(container){
  container.querySelectorAll('[data-pg]').forEach(function(btn){
    btn.onclick=function(){
      var totalPages=Math.ceil(editTotal/EDIT_PAGE)||1;
      var action=this.getAttribute('data-pg');
      var np=editPage;
      if(action==='first')np=0;
      else if(action==='prev')np=Math.max(0,editPage-1);
      else if(action==='next')np=Math.min(totalPages-1,editPage+1);
      else if(action==='last')np=totalPages-1;
      if(np!==editPage){editPage=np;fetchEditItems();window.scrollTo({top:0});}
    };
  });
}

  // Inline price edit (cards + don)

async function toggleComplete(pid, action){
  var ep=action==='complete'?'/api/edits/complete':'/api/edits/uncomplete';
  var r=await apiPost(ep,{productId:pid});
  var j=await r.json();
  if(j.ok){
    showToast(action==='complete'?'Marked completed ✅':'Moved to review',true);
    await refreshSingleItem(pid);
  }else showToast('Failed',false);
}

async function saveInlinePrice(pid){
  var el=$('eitem-'+pid);if(!el)return;
  var stBtn=el.querySelector('[data-st-pid="'+pid+'"].on');
  var st=stBtn?stBtn.getAttribute('data-st-v'):'';
  var body={productId:pid,subTypeName:st,
    marketPrice:($('il-mkt-'+pid)||{value:''}).value,
    lowPrice:   ($('il-low-'+pid)||{value:''}).value,
    midPrice:   ($('il-mid-'+pid)||{value:''}).value,
    highPrice:  ($('il-hip-'+pid)||{value:''}).value};
  var btn=el.querySelector('[data-inline-save="'+pid+'"]');
  if(btn){btn.disabled=true;btn.textContent='…';}
  var r=await apiPost('/api/edits/price',body);
  var j=await r.json();
  if(j.ok){showToast('Saved!',true);await refreshSingleItem(pid);await reloadDBAfterEdit();}
  else{showToast('Save failed',false);if(btn){btn.disabled=false;btn.textContent='💾';}}
}

async function refreshSingleItem(pid){
  try{
    var r=await fetch(apiBase()+'/api/item/'+pid);
    if(!r.ok)return;
    var fresh=await r.json();
    var idx=editItems.findIndex(function(i){return i.productId===pid;});
    if(idx>=0){
      editItems[idx]=fresh;
      var oldEl=$('eitem-'+pid);
      if(oldEl){
        var tmp=document.createElement('div');
        tmp.innerHTML=buildItemRow(fresh);
        var newEl=tmp.firstChild;
        oldEl.replaceWith(newEl);
        // Re-wire all buttons on new element
        newEl.querySelectorAll('[data-edit-pid]').forEach(function(b){b.onclick=function(){openEditOverlay(b.getAttribute('data-edit-pid'));};});
        newEl.querySelectorAll('[data-inline-save]').forEach(function(b){b.onclick=function(){saveInlinePrice(b.getAttribute('data-inline-save'));};});
        newEl.querySelectorAll('[data-st-pid]').forEach(function(b){
          b.onclick=function(){
            var v=b.getAttribute('data-st-v'), p2=b.getAttribute('data-st-pid');
            var row=$('eitem-'+p2);
            if(row)row.querySelectorAll('[data-st-pid="'+p2+'"]').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-st-v')===v);});
          };
        });
        newEl.querySelectorAll('[data-complete-pid]').forEach(function(b){b.onclick=function(){toggleComplete(b.getAttribute('data-complete-pid'),b.getAttribute('data-complete-action'));};});
        // Load OP images for new element
        if(fresh.type==='cards'&&fresh.number) loadInlineOPImages(fresh.productId,fresh.number);
      }
    }
  }catch(e){}
}

// Image usage cache — maps customImageUrl → productId across all products
var _imgUsageCache=null,_imgUsagePending=null;
async function getImageUsage(){
  if(_imgUsageCache)return _imgUsageCache;
  if(!_imgUsagePending)_imgUsagePending=fetch(apiBase()+'/api/image-usage').then(function(r){return r.json();}).then(function(d){_imgUsageCache=d;_imgUsagePending=null;return d;}).catch(function(){_imgUsageCache={};_imgUsagePending=null;return{};});
  return _imgUsagePending;
}
function invalidateImgUsageCache(){_imgUsageCache=null;_imgUsagePending=null;}

// Load OP images into the inline placeholder inside a row
async function loadInlineOPImages(pid,serial){
  var el=$('opimg-'+pid);if(!el)return;
  try{
    var r=await fetch(apiBase()+'/api/card-images?serial='+encodeURIComponent(serial.toUpperCase()));
    var data=await r.json();
    var urls=data.urls||[];
    if(!urls.length){el.textContent='No cached images';el.style.opacity='0.4';return;}
    var usage=await getImageUsage();
    function labelFor(url){
      var m=url.match(/_p(\d+)\.png/i);if(m)return'_p'+m[1];
      var mr=url.match(/_r(\d+)\.png/i);if(mr)return'_r'+mr[1];
      return'FIRST';
    }
    function borderFor(url){
      var owner=usage[url];
      if(!owner)return'var(--bd)';
      return owner===String(pid)?'2px solid rgba(34,197,94,.8)':'2px solid rgba(245,158,11,.8)';
    }
    function labelColor(url){
      var owner=usage[url];
      if(!owner)return'var(--dim)';
      return owner===String(pid)?'var(--grn)':'var(--ylw)';
    }
    function tipFor(url){
      var owner=usage[url];
      if(!owner)return'';
      return owner===String(pid)?'✓ Used by this card':'Used by product #'+owner;
    }
    var html='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">';
    urls.forEach(function(url){
      var border=borderFor(url);
      html+='<div style="text-align:center;cursor:pointer" title="'+esc(tipFor(url))+'" data-op-url="'+esc(url)+'" data-op-pid="'+esc(pid)+'">'
        +'<img src="'+esc(proxyImg(url))+'" style="width:54px;border-radius:5px;background:var(--bg3);border:'+border+'" onerror="this.style.opacity=\'0.2\'" onmouseover="this.style.borderColor=\'var(--ac)\'" onmouseout="this.style.border=\''+border+'\'">'
        +'<div style="font-size:9px;color:'+labelColor(url)+';margin-top:2px;font-weight:700">'+labelFor(url)+'</div>'
        +'</div>';
    });
    html+='</div>';
    el.innerHTML=html;
    el.querySelectorAll('[data-op-url]').forEach(function(div){
      div.onclick=async function(){
        var url=this.getAttribute('data-op-url'), p=this.getAttribute('data-op-pid');
        if(!confirm('Use this image?\n'+url))return;
        var rr=await apiPost('/api/edits/image',{productId:p,imageUrl:url});
        var jj=await rr.json();
        if(jj.ok){showToast('Image set! ✅',true);invalidateImgUsageCache();await refreshSingleItem(p);await reloadDBAfterEdit();}
        else showToast('Failed',false);
      };
    });
  }catch(e){el.textContent='';} 
}

/* ═══ LINKED LISTINGS ═══ */
var lSort='high-low',lFilter='all';
function renderLinked(m){
  var uids=Object.keys(LINKED_LISTINGS),total=uids.reduce(function(a,u){return a+(LINKED_LISTINGS[u]||[]).length;},0);
  var filtered=uids;
  if(lFilter==='cards')filtered=uids.filter(function(u){var x=DB&&DB.byUid.get(u);return x&&x.type==='card';});
  else if(lFilter==='don')filtered=uids.filter(function(u){var x=DB&&DB.byUid.get(u);return x&&x.type==='don';});
  else if(lFilter==='sealed')filtered=uids.filter(function(u){var x=DB&&DB.byUid.get(u);return x&&x.type==='sealed';});
  var sortable=filtered.map(function(uid){var p=DB&&DB.byUid.get(uid);return{uid:uid,name:p?(p.type==='card'?shortName(p):p.name).toLowerCase():'',price:p?p.marketPrice:0};});
  if(lSort==='alpha')sortable.sort(function(a,b){return a.name.localeCompare(b.name);});
  else if(lSort==='high-low')sortable.sort(function(a,b){return b.price-a.price;});
  else sortable.sort(function(a,b){return a.price-b.price;});
  var html='<div class="hd">🔗 Linked Listings <span class="dim" style="font-size:14px;font-weight:500">'+total+' across '+uids.length+' products</span></div>';
  html+='<div class="row mb"><div class="field"><label>Sort</label><select class="inp" id="l-sort"><option value="alpha"'+(lSort==='alpha'?' selected':'')+'>Alphabetical</option><option value="high-low"'+(lSort==='high-low'?' selected':'')+'>Price High→Low</option><option value="low-high"'+(lSort==='low-high'?' selected':'')+'>Price Low→High</option></select></div>';
  html+='<div class="field"><label>Filter</label><select class="inp" id="l-filter"><option value="all"'+(lFilter==='all'?' selected':'')+'>All</option><option value="cards"'+(lFilter==='cards'?' selected':'')+'>Cards</option><option value="don"'+(lFilter==='don'?' selected':'')+'>DON!!</option><option value="sealed"'+(lFilter==='sealed'?' selected':'')+'>Sealed</option></select></div></div>';
  if(total===0)html+='<div class="empty">No linked listings yet.</div>';

/* ═══ DB LOADER (from server API) ═══ */

// After any CSV edit: silently refresh the in-memory DB without disturbing the current tab
async function reloadDBAfterEdit(){
  try{
    var r=await fetch(apiBase()+'/api/db');
    if(!r.ok)return;
    var raw=await r.json();
    if(raw.error||(!raw.allCards&&!raw.sealed&&!raw.don))return;
    var cardMap=new Map(),byUid=new Map();
    Object.entries(raw.cardMapObj||{}).forEach(function(e){cardMap.set(e[0],e[1]);});
    Object.entries(raw.byUidObj||{}).forEach(function(e){byUid.set(e[0],e[1]);});
    DB={cardMap:cardMap,byUid:byUid,sealed:raw.sealed||[],don:raw.don||[],allCards:raw.allCards||[]};
    searchStatus='ready';
    // Refresh searchSel to new DB object so card detail shows updated data
    if(searchSel&&DB.byUid){var f=DB.byUid.get(searchSel.uid);if(f){searchSel=f;if(currentTab==='search')renderDetail($('search-content'));}} 
    updateSearchStatusEl();
  }catch(e){console.warn('reloadDBAfterEdit:',e);}
}

var dbLoadTimer = null;
var dbConnectAttempts = 0;

async function loadDB(){
  // Show a helpful error if opened as file:// AND no API URL is configured
  if(window.location.protocol === 'file:' && !window.TCG_API_URL) {
    var m = $('main');
    if(m) m.innerHTML = '<div style="padding:40px 28px"><div class="empty">'
      + '<div style="font-size:36px;margin-bottom:14px">🚫</div>'
      + '<div style="font-size:16px;font-weight:700;margin-bottom:10px">Wrong URL</div>'
      + '<div class="dim" style="font-size:13px;line-height:1.9">You opened this file directly.<br>'
      + 'Either run <code>npm start</code> and visit '
      + '<a href="http://localhost:3000">http://localhost:3000</a>,<br>'
      + 'or set <code>TCG_API_URL</code> in the config block at the top of this file.</div>'
      + '</div></div>';
    return;
  }

  // Use absolute URL so it works regardless of how the page was reached
  var API = apiBase();

  dbConnectAttempts++;
  searchStatus = dbConnectAttempts > 1
    ? 'Connecting to server… (attempt '+dbConnectAttempts+')'
    : 'Connecting to server…';
  updateSearchStatusEl();
  if(currentTab==='search') renderSearch($('main'));

  // ── 1. Check server status ──
  var status = {};
  try {
    var sr = await fetch(API+'/api/status');
    if(!sr.ok) throw new Error('HTTP '+sr.status);
    status = await sr.json();
    serverStatus = status;
    dbConnectAttempts = 0; // reset on success
  } catch(e) {
    // Server unreachable — keep retrying every 3s (server may still be starting)
    searchStatus = 'Waiting for server… ('+e.message+')';
    updateSearchStatusEl();
    if(currentTab==='search'){
      var m = $('main');
      if(m) m.innerHTML = '<div style="padding:40px 28px">'
        + '<div class="sts"><span class="dot" style="background:#ef4444"></span>'
        + '<span id="sts-txt">'+esc(searchStatus)+'</span></div>'
        + '<div class="empty" style="padding-top:24px">'
        + '<div style="font-size:32px;margin-bottom:12px">⚙️</div>'
        + '<div style="font-size:15px;font-weight:700;margin-bottom:8px">Waiting for server</div>'
        + '<div class="dim" style="font-size:13px;margin-bottom:20px">Make sure <code>npm start</code> is running,<br>then this page will connect automatically.</div>'
        + '<button class="btn btn-ac" onclick="loadDB()">Retry Now</button>'
        + '</div></div>';
    }
    clearTimeout(dbLoadTimer);
    dbLoadTimer = setTimeout(loadDB, 3000);
    return;
  }

  // ── 2. Server is still downloading / no data yet ──
  if(status.updateRunning || status.sets === 0){
    var msg = status.updateRunning
      ? 'Server downloading DB… ' + (status.updateLog || '')
      : 'Waiting for initial download…';
    searchStatus = msg;
    updateSearchStatusEl();
    if(currentTab==='search') renderSearch($('main'));
    clearTimeout(dbLoadTimer);
    dbLoadTimer = setTimeout(loadDB, 4000);
    return;
  }

  // ── 3. Fetch the full DB ──
  try {
    searchStatus = 'Loading database…';
    updateSearchStatusEl();
    if(currentTab==='search') renderSearch($('main'));

    var r = await fetch(API+'/api/db');
    if(!r.ok) throw new Error('HTTP '+r.status+' from /api/db — check server console');
    var raw = await r.json();
    if(raw.error) throw new Error(raw.error);

    var cardMap = new Map(), byUid = new Map();
    Object.entries(raw.cardMapObj||{}).forEach(function(e){ cardMap.set(e[0],e[1]); });
    Object.entries(raw.byUidObj||{}).forEach(function(e){ byUid.set(e[0],e[1]); });
    DB = { cardMap:cardMap, byUid:byUid, sealed:raw.sealed||[], don:raw.don||[], allCards:raw.allCards||[] };
    // Normalize: replace "Super Alternate Art" with "Manga"
    function normName(n){return(n||'').replace(/Super Alternate Art/gi,'Manga');}
    function normItem(item){if(item&&item.name)item.name=normName(item.name);return item;}
    DB.allCards.forEach(normItem);DB.don.forEach(normItem);DB.sealed.forEach(normItem);
    DB.byUid.forEach(normItem);DB.cardMap.forEach(function(arr){arr.forEach(normItem);});

    if(!DB.allCards.length && !DB.sealed.length && !DB.don.length){
      // Empty DB — server may have just wiped corrupt files; wait and retry
      searchStatus = 'DB empty — re-download in progress…';
      updateSearchStatusEl();
      if(currentTab==='search') renderSearch($('main'));
      clearTimeout(dbLoadTimer);
      dbLoadTimer = setTimeout(loadDB, 5000);
      return;
    }

    searchStatus = 'ready';
    lastUpdateAt = status.lastUpdatedAt || 0;
    // Refresh searchSel reference to the new DB object (so detail view gets fresh data)
    if(searchSel && DB && DB.byUid) {
      var fresh = DB.byUid.get(searchSel.uid);
      if(fresh) searchSel = fresh;
    }
    if(currentTab==='search') renderSearch($('main'));
    else updateSearchStatusEl();
    startStatusPolling();
  } catch(e) {
    searchStatus = 'Error loading DB: ' + e.message;
    updateSearchStatusEl();
    if(currentTab==='search') renderSearch($('main'));
    // Retry after 8s in case the DB is still being built
    clearTimeout(dbLoadTimer);
    dbLoadTimer = setTimeout(loadDB, 8000);
  }
}

// Polls every 30s; reloads DB if server ran an update since last load
var lastUpdateAt = 0;
var lastEditSeen = 0;
async function pollServerStatus(){
  try {
    var r = await fetch(API+'/api/status');
    if(!r.ok) return;
    serverStatus = await r.json();
    updateSearchStatusEl();
    if((serverStatus.lastUpdatedAt && serverStatus.lastUpdatedAt > lastUpdateAt) && DB !== null){
      lastUpdateAt = serverStatus.lastUpdatedAt;
      console.log('[poll] Server updated — reloading DB');
      clearTimeout(dbLoadTimer);
      loadDB();
    }
    if(serverStatus.lastEditAt && serverStatus.lastEditAt > lastEditSeen && DB !== null){
      lastEditSeen = serverStatus.lastEditAt;
    }
    // Refresh bars if on edit tab
    if(currentTab==='editcsv'){renderScrapeBar();renderImgBar();renderTCGImgBar();}
    // If server started a new update, reflect that in the status bar
    if(serverStatus.updateRunning) updateSearchStatusEl();
  } catch(e) {}
}

window.onload=function(){
  loadStorage();
  renderAuthBtn();
  applyRoute(location.hash.slice(1)||'search/cards');
  loadDB();
  startStatusPolling();
};
